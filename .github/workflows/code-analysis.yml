name: CI

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 20.x dropped, not overlooked: jsdom 30, which the server-side
        # rich-text sanitiser pulls in, requires node
        # "^22.22.2 || ^24.15.0 || >=26", and its undici reads
        # `markAsUncloneable` from node:worker_threads, which node 20 does not
        # have. Importing jsdom there throws before a single test runs. The
        # runtime image in the Dockerfile is on 22 for the same reason; the two
        # move together. If this matrix grows a second entry, add
        # `fail-fast: false` too, or a lint failure on one line will cancel
        # the other before its tests run.
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Run ESLint
        run: npm run lint:check
      # Runs even when ESLint fails: the repo carries pre-existing lint errors,
      # and a test step gated on a green lint would stay silent for exactly as
      # long as those errors exist. Still skipped when the install failed —
      # without node_modules the run would only mask the real cause.
      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
